name: Build

on:
  push:
    branches:
      - master
      - r*
    tags:
      - '*'
  pull_request:
    branches:
      - master
      - r*
  release:
    types: [published]
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install python build dependencies
      run: |
          python -m pip install --upgrade pip build

    - name: Build wheels
      run: |
        python -m build --wheel --sdist
        cd tensorboard_plugin && python -m build --wheel --sdist && cd ..
        mkdir wheelhouse
        mv dist/* wheelhouse/
        mv tensorboard_plugin/dist/* wheelhouse/
    - name: List and check wheels
      run: |
        pip install twine pkginfo>=1.11.0
        ls -lh wheelhouse/
        twine check wheelhouse/*
    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        name: wheels
        path: ./wheelhouse/*

  upload_to_pypi:
    name: Upload to PyPI
    runs-on: ubuntu-latest
    if: (github.event_name == 'release' && github.event.action == 'published') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch')
    needs: [build]
    environment:
      name: pypi
      url: https://pypi.org/p/fairness-indicators
    permissions:
      id-token: write
    steps:
      - name: Retrieve wheels
        uses: actions/download-artifact@v4.1.8
        with:
          name: wheels
          path: wheels

      - name: List the build artifacts
        run: |
          ls -lAs wheels/

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1.12
        with:
          password: ${{ secrets.PYPI_API_TOKEN || secrets.PYPI_TOKEN || secrets.PYPI_PASSWORD }}
          packages-dir: wheels/
          skip-existing: true
          verify-metadata: false
          verbose: true
